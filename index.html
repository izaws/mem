<div class="top"><button class="ib mbtn" onclick="tm(event)" aria-label="選單"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button><div id="mn" onclick="event.stopPropagation()"><div class="mi" onclick="exp();cm()">匯出備份</div><label class="mi">匯入備份<input type="file" accept=".json,application/json" hidden onchange="imp(this.files[0]);cm()"></label><div class="mi" onclick="cm();mgOpen()">管理分類</div><div class="mi" onclick="out()">登出</div></div></div><div class="tabs" id="tabs"></div><div id="list"></div><div class="note" id="msg"></div><div id="toast" style="display:none;position:fixed;left:50%;transform:translateX(-50%);width:min(calc(100% - 32px),488px);bottom:90px;background:var(--ac);color:var(--bg);padding:12px;border-radius:12px;z-index:20;text-align:center"></div>

<script>

const SB_URL="https://htjusjqfuiaxdcixalkl.supabase.co",SB_KEY="sb_publishable_cJYgIPUuiXTJQOCgn_1-gQ_mRv9D3ua";
const sb=supabase.createClient(SB_URL,SB_KEY),BK="photos";let uid=null;
let db,assets,col,items=[],host="全部",cur=null,collapsed={};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const getHosts=()=>[...new Set([...HOSTS,...items.map(i=>i.host).filter(Boolean)])];
const tot=i=>sumP(i)+effE(i), url=id=>id.startsWith("data:")?id:sb.storage.from(BK).getPublicUrl(id).data.publicUrl;
let TH=0;const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(TH);TH=setTimeout(()=>{t.style.display="none"},4000)};

col={doc:id=>({set:async d=>{const {error}=await sb.from("items").upsert({id,data:d,updated_at:new Date().toISOString()});if(error)throw error},delete:async()=>{const {error}=await sb.from("items").delete().eq("id",id);if(error)throw error}})};
async function load(){const {data,error}=await sb.from("items").select("id,data");if(error){$("#msg").textContent="同步失敗："+error.message;return}const cf=data.find(r=>r.id==="_cfg");if(cf){if(cf.data.statuses?.length)STATUS=cf.data.statuses;if(cf.data.types?.length)TYPES=cf.data.types;if(cf.data.hosts?.length)HOSTS=cf.data.hosts;if(cf.data.currencies?.length)CURS=cf.data.currencies}items=data.filter(r=>r.id!=="_cfg").map(r=>({id:r.id,...r.data}));render()}

async function start(){const {data}=await sb.auth.getSession();if(!data.session){$("#lg").classList.add("on");return}
 uid=data.session.user.id;$("#lg").classList.remove("on");await load();sb.channel("items").on("postgres_changes",{event:"*",schema:"public",table:"items"},load).subscribe()}
function init(){start()}
function render(){
 const hosts=["全部",...getHosts()];
 if(!hosts.includes(host))host="全部";
 $("#tabs").innerHTML=hosts.map(h=>`<div class="tab ${h===host?"on":""}" onclick="host='${esc(h).replace(/'/g,"\\'")}';render()">${esc(h)}</div>`).join("");
 const vis=items.filter(i=>host==="全部"||i.host===host);
 const gs=STATUS.map((s,k)=>[s,k,vis.filter(i=>i.status===s)]);const ot=vis.filter(i=>!STATUS.includes(i.status));if(ot.length)gs.push(["其他",-1,ot]);
 $("#list").innerHTML=gs.map(([s,k,a])=>{if(!a.length)return"";
  const sums={};a.forEach(i=>{const c=i.cur||"TWD";sums[c]=(sums[c]||0)+tot(i)});
  const open=!collapsed[k];
  return`<div class="sec"><div class="sh" onclick="collapsed[${k}]=${open};render()"><span>${open?"▾":"▸"} ${esc(s)} <small>${a.length} 種 · ${Object.entries(sums).map(([c,n])=>fmt(c,n)).join(" + ")||"0"}</small></span></div>${open?`<div class="grid">${a.map(card).join("")}</div>`:""}</div>`}).join("");
 if(!items.length&&col)$("#msg").textContent="按右下角 + 新增第一件收藏品";else if(col)$("#msg").textContent="";
}
const card=i=>`<div class="it"><div class="im" onclick="${i.images?.length?`bigItem('${i.id}')`:`openEd('${i.id}')`}">${i.images?.length?`<img src="${url(i.images[0])}">`:"無圖"}</div><b>${esc(i.name)}</b><span>${i.cur?fmt(i.cur,tot(i)):""}</span><button class="eb" onclick="openEd('${i.id}')">編輯</button></div>`;
function openEd(id){
 cur=id?{...items.find(i=>i.id===id)}:{id:"i"+Date.now(),name:"",qty:1,images:[],types:[],status:STATUS[0],host:"",cur:CURS[0].k,lines:[],extraTotal:"",links:[],note:"",date:new Date().toISOString().slice(0,10)};
 if(id)cur.lines=LN(cur).map(x=>({...x}));
 cur._new=!id;ed();$("#ed").classList.add("on");
}
function ed(){const c=cur;LK=keys(c);
 $("#ed").innerHTML=`<div class="bar"><button class="p" onclick="closeEd()">取消</button><b>${c._new?"新增":"編輯"}收藏品</b><button class="p" onclick="save()">儲存</button></div>

<label class="l">照片（可多張，也可直接貼上）</label><div class="cd"><div class="th">${c.images.map((x,k)=>`<div><img src="${url(x)}" onclick="big(${k})"><i onclick="c_rm(${k})">×</i></div>`).join("")}<label class="add">＋ 選圖<input type="file" accept="image/*" multiple hidden onchange="addFiles(this.files)"></label></div><div id="pz" class="pz" contenteditable="true" data-ph="點這裡 → 再點一次選「貼上」" oninput="pzIn(this)"></div></div>

<label class="l">商品類型（可多選）<a class="mgl" onclick="mgOpen()">管理</a></label><div class="cd chips">${[...new Set([...getTypes(),...c.types])].map(t=>`<span class="c ${c.types.includes(t)?"on":""}" onclick="tg('${esc(t)}')">${esc(t)}</span>`).join("")}<span class="c" onclick="nt()">＋ 自訂</span><div id="nt" style="display:none;width:100%;display:none"><input id="nti" placeholder="新類型名稱，按 Enter" onkeydown="if(event.key==='Enter')nt2()"></div></div>

${c.lines.map((l,n)=>`<div class="row dr" data-k="l" data-i="${n}"><div class="mr"><span class="hd" onpointerdown="dragStart(event)">≡</span><input placeholder="品項名稱（如 壓克力A）" value="${esc(l.n||"")}" oninput="ln(${n},'n',this.value)"><button class="ib" style="color:var(--tx)" onclick="lnCp(${n})">${CP}</button><button class="ib" onclick="lnDel(${n})">${TR}</button></div><div class="mr"><span>單價</span>${esc(sym(c.cur))}<input type="number" inputmode="decimal" value="${esc(l.price??"")}" oninput="ln(${n},'price',this.value)"></div><div class="mr"><span>二補單價</span>${esc(sym(c.cur))}<input type="number" inputmode="decimal" value="${esc(l.extra??"")}" oninput="ln(${n},'extra',this.value)"></div><div class="mr"><span>數量</span><input type="number" inputmode="numeric" value="${esc(l.q??1)}" oninput="ln(${n},'q',this.value)"></div></div>`).join("")}
<div class="row chips" style="padding:10px 4px"><span class="c" onclick="lnAdd(-1)">＋ 新增品項</span>${c.types.map((t,k)=>`<span class="c" onclick="lnAdd(${k})">＋ ${esc(t)}</span>`).join("")}</div>
<div class="row"><div class="mr"><span>小計</span><b id="sp">${fmt(c.cur,sumP(c))}</b></div><div class="mr"><span>總二補</span>${esc(sym(c.cur))}<input id="et" type="number" inputmode="decimal" value="${esc(c.extraTotal??"")}" placeholder="自動 ${autoE(c)}（可手動輸入）" oninput="cur.extraTotal=this.value;t()"></div></div>
<div class="tot" id="t">總金額 ${fmt(c.cur,tot(c))}</div></div>

<label class="l">備註</label><div class="cd"><textarea rows="3" oninput="cur.note=this.value">${esc(c.note)}</textarea></div>

${c._new?"":`<button class="p del" onclick="del()">刪除此收藏品</button>`}`}
const t=()=>{$("#t").textContent="總金額 "+fmt(cur.cur,tot(cur));$("#sp").textContent=fmt(cur.cur,sumP(cur));$("#et").setAttribute("placeholder","自動 "+autoE(cur)+"（可手動輸入）")};

const c_rm=k=>{cur.images.splice(k,1);ed()};
let LB=[],LI=0;const lbShow=()=>{$("#lbi").setAttribute("src",url(LB[LI]));$("#lbn").textContent=LB.length>1?(LI+1)+" / "+LB.length:""};
const big=k=>{LB=cur.images;LI=k;lbShow();$("#lb").classList.add("on")};const bigItem=id=>{const i=items.find(x=>x.id===id);LB=i.images;LI=0;lbShow();$("#lb").classList.add("on")};
function lbClick(e){if(e.target.id==="lbi"&&LB.length>1){LI=(LI+1)%LB.length;lbShow()}else $("#lb").classList.remove("on")}
function shrink(f,m,q){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.addEventListener("load",()=>{try{const r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.setAttribute("width",Math.round(im.width*r));c.setAttribute("height",Math.round(im.height*r));c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error("轉檔失敗")),"image/jpeg",q)}catch(e){no(e)}});im.addEventListener("error",()=>no(new Error("無法讀取圖片")));im.setAttribute("src",u)})}
const b2d=b=>new Promise((r,n)=>{const x=new FileReader();x.addEventListener("load",()=>r(x.result));x.addEventListener("error",()=>n(new Error("讀檔失敗")));x.readAsDataURL(b)});
function pzIn(el){const im=[...el.querySelectorAll("img")].map(x=>x.getAttribute("src"));el.textContent="";im.forEach(async u=>{try{addFiles([await (await fetch(u)).blob()])}catch(e){toast("貼上失敗")}})}
async function addFiles(fs){toast("處理圖片中…");let n=0;for(const f of fs){try{let id=null;if(assets){try{id=(await assets.upload(await shrink(f,1600,.82))).id}catch(e){}}
 if(!id)id=await b2d(await shrink(f,640,.55));cur.images=[...cur.images,id];n++}catch(e){toast("圖片失敗："+e.message+" @"+String(e.stack||"").split("\n")[0].slice(0,60))}}ed();if(n)toast("已加入 "+n+" 張")}
document.addEventListener("paste",e=>{if(!$("#ed").classList.contains("on"))return;const fs=[...e.clipboardData.items].filter(i=>i.kind==="file"&&i.type.startsWith("image/")).map(i=>i.getAsFile()).filter(Boolean);if(fs.length){e.preventDefault();addFiles(fs)}});
const closeEd=()=>$("#ed").classList.remove("on");
async function save(){if(!cur.name&&!cur.images.length)return toast("照片或名稱至少需要填寫一項");const d={...cur};delete d._new;delete d.id;d.lines=(d.lines||[]).filter(l=>l.n||l.price||l.extra);d.links=[d.links[0]||"",d.links[1]||""];
 try{await col.doc(cur.id).set(d);closeEd()}catch(e){toast("儲存失敗："+(e.code||e.message))}}
function ask(m){return new Promise(ok=>{const d=$("#ask");d.innerHTML=`<div class="ab"><p>${esc(m)}</p><div><button class="p" id="ano">否</button><button class="p" id="ays" style="background:var(--red);color:#fff">是</button></div></div>`;d.classList.add("on");const f=v=>{d.classList.remove("on");ok(v)};$("#ano").addEventListener("click",()=>f(false));$("#ays").addEventListener("click",()=>f(true))})}
async function del(){if(!await ask("是否確認刪除？"))return;try{await col.doc(cur.id).delete();closeEd()}catch(e){toast("刪除失敗："+(e.message||e.code))}}
const d2b=d=>{const [h,b]=d.split(","),m=h.match(/:(.*?);/)[1],a=atob(b),u=new Uint8Array(a.length);for(let i=0;i<a.length;i++)u[i]=a.charCodeAt(i);return new Blob([u],{type:m})};
const toD=async id=>{if(id.startsWith("data:"))return id;const r=await fetch(url(id));return b2d(await r.blob())};
async function exp(){toast("打包中…");try{const out=[];for(const i of items){const o={...i};const im=await Promise.all((i.images||[]).map(x=>toD(x).catch(()=>null)));o.images=im.filter(Boolean);out.push(o)}
 const bl=new Blob([JSON.stringify({v:1,items:out})],{type:"application/json"}),al=document.createElement("a");al.setAttribute("href",URL.createObjectURL(bl));al.setAttribute("download","收藏手帳-"+new Date().toISOString().slice(0,10)+".json");document.body.appendChild(al);al.click();al.remove();toast("已匯出 "+out.length+" 件")}catch(e){toast("匯出失敗："+(e.code||e.message))}}
async function imp(f){if(!f||!col)return;try{const j=JSON.parse(await f.text());let n=0;toast("匯入中…");for(const it of j.items||[]){const imgs=[];for(const d of it.images||[]){try{const b=d2b(d);let id=null;if(assets){try{id=(await assets.upload(await shrink(b,1600,.82))).id}catch(e){}}
 if(!id)id=await b2d(await shrink(b,640,.55));imgs.push(id)}catch(e){}}
 const {id:oid,...data}=it;data.images=imgs;await col.doc(oid||"i"+Date.now()+n).set(data);n++}toast("已匯入 "+n+" 件")}catch(e){toast("匯入失敗："+(e.code||e.message))}}
let PEND="",DG=null;const getTypes=()=>[...new Set([...TYPES,...items.flatMap(i=>i.types||[])])];
const LIST=k=>({s:STATUS,t:TYPES,h:HOSTS,c:CURS,l:cur&&cur.lines})[k];
const setL=(k,a)=>{if(k==="s")STATUS=a;else if(k==="t")TYPES=a;else if(k==="h")HOSTS=a;else CURS=a};
const nmOf=(k,x)=>k==="c"?x.n:x;
const saveCfg=()=>col.doc("_cfg").set({statuses:STATUS,types:TYPES,hosts:HOSTS,currencies:CURS});
const putItem=i=>{const {id,_new,...d}=i;return col.doc(id).set(d)};
function mgOpen(){TYPES=getTypes();HOSTS=getHosts();mgR();$("#mg").classList.add("on")}
function mgClose(){$("#mg").classList.remove("on");if($("#ed").classList.contains("on"))ed()}
function mgR(){const sec=(t,k)=>{const L=LIST(k);return`<label class="l">${t}（按住 ≡ 拖動排序）</label><div class="cd">${L.map((x,i)=>`<div class="mr ${i?"row ":""}dr" data-k="${k}" data-i="${i}"><span class="hd" onpointerdown="dragStart(event)">≡</span>${k==="c"?`<input value="${esc(x.n)}" onchange="mgCur(${i},'n',this.value)"><input style="width:64px;flex:none" value="${esc(x.s)}" onchange="mgCur(${i},'s',this.value)">`:`<input value="${esc(x)}" onchange="mgRen('${k}',${i},this.value)">`}<button class="ib" onclick="mgDel('${k}',${i})">${TR}</button></div>`).join("")}<div class="mr row">${k==="c"?`<input id="addc" placeholder="幣別名稱"><input id="addcs" style="width:64px;flex:none" placeholder="符號">`:`<input id="add${k}" placeholder="新增${t}">`}<button class="p" onclick="mgAdd('${k}')">新增</button></div></div>`};
 $("#mg").innerHTML=`<div class="bar"><span style="width:60px"></span><b>管理分類</b><button class="p" onclick="mgClose()">完成</button></div>`+sec("狀態","s")+sec("商品類型","t")+sec("開團者","h")+sec("幣別","c")}
function dragStart(e){const row=e.currentTarget.closest(".dr");DG={row,k:row.dataset.k,list:row.parentNode};row.classList.add("dg");e.currentTarget.setPointerCapture(e.pointerId)}
document.addEventListener("pointermove",e=>{if(!DG)return;e.preventDefault();for(const r of DG.list.querySelectorAll(".dr")){if(r===DG.row)continue;const b=r.getBoundingClientRect();if(e.clientY>b.top&&e.clientY<b.bottom){if(e.clientY<b.top+b.height/2)DG.list.insertBefore(DG.row,r);else r.after(DG.row);break}}},{passive:false});
document.addEventListener("pointerup",()=>{if(!DG)return;const g=DG;DG=null;g.row.classList.remove("dg");const L=LIST(g.k),o=[...g.list.querySelectorAll(".dr")].map(r=>+r.dataset.i);if(o.every((v,i)=>v===i))return;if(g.k==="l"){cur.lines=o.map(i=>L[i]);ed();return}setL(g.k,o.map(i=>L[i]));mgSave()});
async function mgSave(){try{await saveCfg();await load()}catch(e){toast("失敗："+(e.message||e.code))}mgR()}
async function mgAdd(k){if(k==="c"){const n=$("#addc").value.trim(),y=$("#addcs").value.trim();if(!n||!y)return toast("請填名稱和符號");CURS.push({k:"c"+Date.now().toString(36),n,s:y});return mgSave()}
 const v=$("#add"+k).value.trim();if(!v)return;if(LIST(k).includes(v))return toast("已有相同名稱");LIST(k).push(v);await mgSave()}
async function mgCur(i,f,v){v=v.trim();if(!v)return mgR();CURS[i][f]=v;await mgSave()}
async function mgRen(k,i,v){v=v.trim();const L=LIST(k),o=L[i];if(!v||v===o)return mgR();if(L.includes(v)){toast("已有相同名稱");return mgR()}L[i]=v;
 const fx=it=>{const n={...it};let ch=false;if(k==="s"&&n.status===o){n.status=v;ch=true}if(k==="h"&&n.host===o){n.host=v;ch=true}
  if(k==="t"&&(n.types||[]).includes(o)){n.types=n.types.map(x=>x===o?v:x);if(n.lines&&n.lines[o]!==undefined){n.lines={...n.lines,[v]:n.lines[o]};delete n.lines[o]}ch=true}return ch?n:null};
 try{await saveCfg();for(const it of items){const n=fx(it);if(n)await putItem(n)}if(cur){const n=fx(cur);if(n)cur=n}await load()}catch(e){toast("失敗："+(e.message||e.code))}mgR()}
async function mgDel(k,i){const L=LIST(k),o=L[i],nm=nmOf(k,o);
 const used=k==="s"?items.filter(x=>x.status===o).length:k==="h"?items.filter(x=>x.host===o).length:k==="c"?items.filter(x=>x.cur===o.k).length:0;
 if(used)return toast("還有 "+used+" 件使用「"+nm+"」，請先改掉它們");if((k==="s"||k==="c")&&L.length<2)return toast("至少要留一個");
 if(!await ask("是否確認刪除「"+nm+"」？"))return;L.splice(i,1);
 try{if(k==="t"){for(const it of items)if((it.types||[]).includes(o))await putItem({...it,types:it.types.filter(x=>x!==o)});if(cur)cur.types=cur.types.filter(x=>x!==o)}await saveCfg();await load()}catch(e){toast("失敗："+(e.message||e.code))}mgR()}
init();
</script></body></html>
